<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Downtown Drinking and Running</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DT Running">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0A0A0A;
    --paper-raised: #161616;
    --ink: #F2F0EA;
    --ink-soft: #A6A39C;
    --line: #2B2B2B;
    --orange: #FF5A1F;
    --orange-deep: #FF7A45;
    --chartreuse: #C9F24B;
    --stone: #6E6C66;
    --display: 'Oswald', 'Arial Narrow', sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; color: var(--ink); font-family: var(--body);
    background-color: var(--paper);
    overflow-wrap: break-word; word-wrap: break-word;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  .hidden { display: none !important; }
  button { font-family: var(--body); }
  .btn { cursor: pointer; border-radius: 999px; border: none; font-weight: 700; transition: transform .08s ease; }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--orange); color: #fff; padding: 12px 18px; font-size: 14px; }
  .btn-dark { background: var(--ink); color: var(--paper); padding: 12px 18px; font-size: 14px; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 12px 18px; font-size: 14px; border-radius: 10px; }
  input, textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--paper-raised); font-size: 14px; color: var(--ink); font-family: var(--body);
  }
  input:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  @media (max-width: 480px) {
    input, textarea, .comment-input { font-size: 16px; }
  }
  label.field-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  .field { margin-bottom: 12px; }
  .type-toggle { display: flex; gap: 8px; }
  .type-toggle-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-soft); font-weight: 700; font-size: 14px; font-family: var(--body); cursor: pointer; text-align: center; }
  .type-toggle-btn.active-run { background: var(--orange); border-color: var(--orange); color: #fff; }
  .type-toggle-btn.active-social { background: var(--chartreuse); border-color: var(--chartreuse); color: #111; }
  .type-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .3px; padding: 2px 8px; border-radius: 999px; margin-left: 7px; vertical-align: middle; }
  .type-badge.type-run { background: rgba(255,90,31,0.18); color: var(--orange); }
  .type-badge.type-social { background: rgba(201,242,75,0.18); color: var(--chartreuse); }

  /* ---- auth screen ---- */
  #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; padding-top: calc(24px + env(safe-area-inset-top)); }
  .auth-card { background: var(--paper-raised); border: 1px solid var(--line); border-top: 4px solid var(--orange); border-radius: 4px 4px 20px 20px; padding: 28px; max-width: 380px; width: 100%; box-shadow: 0 10px 30px rgba(32,35,43,0.06); }
  .brand { font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: .2px; line-height: 1.15; }
  .brand-sub { color: var(--ink-soft); font-size: 13px; margin-top: 6px; margin-bottom: 22px; }
  .auth-error { background: #331812; border: 1px solid var(--orange-deep); color: var(--orange-deep); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .auth-toggle { text-align: center; margin-top: 14px; font-size: 13px; color: var(--ink-soft); }
  .auth-toggle a { color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: underline; }

  /* ---- app shell ---- */
  header.app-header { position: relative; padding: calc(24px + env(safe-area-inset-top)) 0 18px; }
  header.app-header::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background-image: repeating-linear-gradient(90deg, var(--orange) 0 12px, transparent 12px 20px);
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .avatar-btn { min-width: 36px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--ink); color: var(--paper); border: none; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: .2px; cursor: pointer; white-space: nowrap; }

  .sticky-nav {
    position: sticky; top: env(safe-area-inset-top);
    background: var(--paper); z-index: 5;
    padding-top: 6px; margin: 0 -16px; padding-left: 16px; padding-right: 16px;
  }

  .banner { width: 100%; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--paper); border-radius: 16px; padding: 14px 16px; border: none; cursor: pointer; text-align: left; margin-top: 18px; position: relative; overflow: hidden; }
  .banner-date { flex: 0 0 auto; width: 54px; height: 54px; border-radius: 12px; background: var(--orange); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .banner-date .mon { font-family: var(--display); font-size: 10px; font-weight: 600; color: #fff; letter-spacing: .5px; }
  .banner-date .day { font-family: var(--display); font-size: 22px; font-weight: 700; color: #fff; }
  .banner-tag { font-size: 11px; font-weight: 600; color: var(--orange-deep); letter-spacing: .3px; }
  .banner-title { font-size: 16px; font-weight: 700; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .banner-meta { font-size: 12.5px; color: #4A4A4A; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px 10px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 20px; }
  .tab-btn { flex: 1 1 0; min-width: 0; position: relative; padding: 10px 2px 12px; border: none; cursor: pointer; background: none; font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: .1px; color: var(--ink-soft); white-space: normal; text-align: center; line-height: 1.2; }
  @media (max-width: 420px) {
    .tab-btn { font-size: 11.5px; }
  }
  .tab-btn.active { color: var(--ink); }
  .tab-btn.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 2px 2px 0 0; background: var(--orange); }
  .tab-count { margin-left: 5px; font-size: 11px; font-weight: 700; color: var(--orange-deep); }

  main { padding: 20px 0 60px; }

  /* calendar */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav-btn { width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-raised); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  .cal-month { font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: .5px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-weekday { text-align: center; font-size: 11px; color: var(--stone); font-weight: 600; padding: 4px 0; }
  .cal-day { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .cal-day.selected { border: 2px solid var(--ink); background: var(--ink); color: var(--paper); }
  .cal-day.other-month { opacity: .45; }
  .cal-day .num { font-size: 13px; font-weight: 500; }
  .cal-day.is-today { box-shadow: inset 0 0 0 2px var(--orange); }
  .cal-day.is-today.selected { box-shadow: none; }
  .cal-day .today-mark { font-weight: 700; }
  .cal-day .count-badge {
    position: absolute; top: 3px; right: 3px; min-width: 14px; height: 14px; padding: 0 3px;
    border-radius: 999px; background: var(--orange); color: #fff; font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .cal-day.selected .count-badge { background: var(--chartreuse); color: var(--ink); }

  .day-panel { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 22px; }
  .day-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .day-panel-head .title { font-family: var(--display); font-size: 16px; font-weight: 600; }

  .empty-note { color: var(--ink-soft); font-size: 14px; padding: 18px 0; }
  .empty-state { text-align: center; padding: 36px 12px; }
  .empty-state svg { margin-bottom: 10px; }
  .empty-state .empty-title { font-family: var(--display); font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .empty-state .empty-body { color: var(--ink-soft); font-size: 14px; }

  /* run card */
  .run-card { background: var(--paper-raised); border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 4px 14px 14px 4px; padding: 14px 14px 14px 16px; margin-bottom: 10px; }
  .run-card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .run-title { font-size: 16px; font-weight: 700; }
  .run-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; color: var(--ink-soft); }
  .run-notes { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .run-by { font-size: 11px; color: var(--stone); margin-top: 6px; }
  .run-delete { background: none; border: none; color: var(--stone); cursor: pointer; padding: 4px; }
  .rsvp-row { display: flex; gap: 6px; margin-top: 12px; }
  .rsvp-btn { flex: 1; font-size: 12.5px; font-weight: 600; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); cursor: pointer; }
  .rsvp-btn.active-going { background: var(--orange); border-color: var(--orange); color: #fff; }
  .rsvp-btn.active-interested { background: var(--chartreuse); border-color: var(--chartreuse); color: var(--ink); }
  .rsvp-btn.active-not { background: var(--stone); border-color: var(--stone); color: #fff; }
  .who-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .avatar-stack { display: flex; }
  .avatar-chip { width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border: 2px solid var(--paper-raised); margin-left: -8px; }
  .avatar-chip:first-child { margin-left: 0; }
  .who-label { font-size: 12px; color: var(--ink-soft); flex: 1 1 160px; min-width: 0; }

  .comments-section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .comment-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; max-height: 200px; overflow-y: auto; }
  .comment-item { display: flex; flex-direction: column; gap: 3px; }
  .comment { font-size: 13px; color: var(--ink); line-height: 1.4; display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .comment-name { font-weight: 700; margin-right: 2px; }
  .comment-delete { flex-shrink: 0; background: none; border: none; color: var(--stone); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .reaction-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .reaction-btn { font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; line-height: 1.7; }
  .reaction-btn.active { background: var(--chartreuse); border-color: var(--chartreuse); }
  .comment-form { display: flex; gap: 6px; }
  .comment-input { flex: 1; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .comment-send { padding: 0 14px; border-radius: 8px; border: none; background: var(--ink); color: var(--paper); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .race-date-head { font-family: var(--display); font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
  .member-count { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .member-list { display: flex; flex-direction: column; gap: 10px; }
  .member-row { display: flex; align-items: center; gap: 12px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .member-row .avatar-chip { width: 58px; height: 58px; font-size: 20px; flex-shrink: 0; border-width: 0; }
  .member-name { font-size: 14.5px; font-weight: 700; }
  .member-joined { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  /* ---- profile screen ---- */
  .profile-identity { display: flex; align-items: center; gap: 14px; margin: 10px 0 18px; }
  .profile-photo-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .profile-photo { width: 64px; height: 64px; border-radius: 999px; background: var(--orange); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 22px; font-weight: 700; overflow: hidden; }
  .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
  .profile-photo-upload { font-size: 11px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
  .profile-name { font-family: var(--display); font-size: 20px; font-weight: 600; }
  .profile-email { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  #photo-upload-status { font-size: 12.5px; color: var(--ink-soft); margin: -10px 0 14px; }
  .profile-stats { display: flex; gap: 10px; margin-bottom: 24px; }
  .stat-box { flex: 1; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .stat-box .stat-num { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--orange); }
  .stat-box .stat-label { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
  .profile-section { margin-bottom: 26px; }
  .profile-section-title { font-family: var(--display); font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .profile-list-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .profile-list-item .pli-title { font-size: 13.5px; font-weight: 700; }
  .profile-list-item .pli-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .profile-list-item .pli-delete { background: none; border: none; color: var(--stone); cursor: pointer; font-size: 15px; flex-shrink: 0; }
  .profile-list-empty { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .club-result-row { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .club-result-row .cr-title { font-size: 13.5px; font-weight: 700; }
  .club-result-row .cr-date { font-size: 12px; color: var(--ink-soft); margin: 1px 0 8px; }
  .club-result-row .cr-input-row { display: flex; gap: 6px; }
  .club-result-row input { font-size: 13px; padding: 7px 10px; }
  .club-result-row .cr-save { padding: 0 12px; border-radius: 8px; border: none; background: var(--orange); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  .goal-row { display: flex; align-items: flex-start; gap: 10px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .goal-check { flex-shrink: 0; width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--line); background: none; cursor: pointer; margin-top: 1px; }
  .goal-check.done { background: var(--chartreuse); border-color: var(--chartreuse); }
  .goal-text { font-size: 13.5px; font-weight: 600; flex: 1; }
  .goal-text.done { text-decoration: line-through; color: var(--ink-soft); }
  .goal-target { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .profile-add-form { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .delete-account-link {
    display: block; width: 100%; text-align: center; background: none; border: none;
    color: var(--stone); font-size: 12px; text-decoration: underline; cursor: pointer;
    margin-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  .delete-account-link:hover { color: var(--orange-deep); }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(32,35,43,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-sheet { background: var(--paper); border-radius: 20px 20px 0 0; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-title { font-family: var(--display); font-size: 20px; font-weight: 600; }
  .modal-close { background: none; border: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink); }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }

  .fab { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: 24px; width: 56px; height: 56px; border-radius: 999px; background: var(--orange); color: #fff; border: none; font-size: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.25); cursor: pointer; }

  .loading-note { color: var(--ink-soft); text-align: center; padding: 40px 0; }
</style>
</head>
<body>


<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="brand">Downtown Drinking and Running</div>
    <div class="brand-sub">Sign in to see the group calendar</div>
    <div id="auth-error" class="auth-error hidden"></div>

    <form id="signin-form">
      <div class="field">
        <label class="field-label">Email</label>
        <input type="email" id="signin-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input type="password" id="signin-password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-dark" style="width:100%;">Log in</button>
    </form>

    <form id="signup-form" class="hidden">
      <div class="field">
        <label class="field-label">Your name</label>
        <input type="text" id="signup-name" required autocomplete="name" />
      </div>
      <div class="field">
        <label class="field-label">Email</label>
        <input type="email" id="signup-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="field-label">Password</label>
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
    </form>

    <div class="auth-toggle">
      <span id="to-signup">New here? <a>Create an account</a></span>
      <span id="to-signin" class="hidden">Already a member? <a>Log in</a></span>
    </div>
    <div class="auth-toggle" style="margin-top:6px;">
      <a id="forgot-password">Forgot password?</a>
    </div>
  </div>
</div>

<!-- ============ APP SHELL ============ -->
<div id="app" class="hidden">
  <div class="wrap">
    <header class="app-header">
      <div class="header-row">
        <div style="min-width:0;">
          <div class="brand">Downtown Drinking and Running</div>
        </div>
        <button class="avatar-btn" id="avatar-btn" title="Sign out" style="flex-shrink:0;">--</button>
      </div>
    </header>

    <div class="sticky-nav">
      <div id="banner-slot"></div>

      <div class="tabs">
        <button class="tab-btn" data-tab="races">Upcoming <span class="tab-count" id="races-count"></span></button>
        <button class="tab-btn" data-tab="calendar">Calendar</button>
        <button class="tab-btn" data-tab="history">Race history</button>
        <button class="tab-btn" id="mypage-tab" data-tab="mypage">My page</button>
        <button class="tab-btn" data-tab="members">Members</button>
      </div>
    </div>

    <main id="main-content">
      <div class="loading-note">Loading the calendar…</div>
    </main>
  </div>

  <button class="fab" id="fab-add" title="Add an event">+</button>
</div>

<!-- ============ ADD RUN MODAL ============ -->
<div id="add-modal-overlay" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-head">
      <div class="modal-title">Add an event</div>
      <button class="modal-close" id="close-add-modal">&times;</button>
    </div>
    <form id="add-run-form">
      <div class="field">
        <label class="field-label">What kind of event?</label>
        <div class="type-toggle">
          <button type="button" class="type-toggle-btn active-run" id="type-btn-run" data-type="run">Run</button>
          <button type="button" class="type-toggle-btn" id="type-btn-social" data-type="social">Social</button>
        </div>
      </div>
      <div class="field">
        <label class="field-label">What are we calling it?</label>
        <input type="text" id="run-title" placeholder="Saturday long run" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label">Date</label>
          <input type="date" id="run-date" required />
        </div>
        <div class="field">
          <label class="field-label">Time</label>
          <input type="time" id="run-time" value="07:00" />
        </div>
      </div>
      <div class="field">

// ---------------------------------------------------------------------
// constants / helpers
// ---------------------------------------------------------------------
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAYS = ["S","M","T","W","T","F","S"];
const STATUS = {
  going: { label: "Going", cls: "active-going" },
  interested: { label: "Interested", cls: "active-interested" },
  not: { label: "Not for me", cls: "active-not" },

  { key: "15k", label: "15K" },
  { key: "half", label: "Half Marathon" },
  { key: "marathon", label: "Marathon" },
];
function typeOf(run) { return run.type === "social" ? "social" : "run"; }
function typeColor(t) { return t === "social" ? "var(--chartreuse)" : "var(--orange)"; }

function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function initials(name){ if(!name) return "?"; const p=name.trim().split(/\s+/); return ((p[0]?.[0]||"")+(p[1]?.[0]||"")).toUpperCase() || name[0].toUpperCase(); }
function fmtTime(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); const period=h>=12?"PM":"AM"; const h12=h%12===0?12:h%12; return `${h12}:${String(m).padStart(2,"0")} ${period}`; }
function fmtDateLong(d){ return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; }
function fmtBirthdayShort(dateStr){ const d = new Date(dateStr + "T00:00:00"); return `${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`; }
function daysUntilLabel(dateStr){
  const today=new Date(); const todayMid=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const target=new Date(dateStr+"T00:00:00"); const diff=Math.round((target-todayMid)/86400000);
  if(diff===0) return "Today"; if(diff===1) return "Tomorrow"; if(diff>1) return `In ${diff} days`; return "Past";
}
function buildMonthGrid(year, month){
  const first=new Date(year,month,1); const start=new Date(first); start.setDate(first.getDate()-first.getDay());
  const days=[]; for(let i=0;i<42;i++){ const d=new Date(start); d.setDate(start.getDate()+i); days.push(d); } return days;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, (c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function shoeSole(fill) {
  return `
    <path d="M13,24 C13,17 17,12 22,12 C27,12 31,17 31,24 L31,40 C31,47 27,52 22,52 C17,52 13,47 13,40 Z" fill="${fill}"/>

    <rect x="15" y="25.5" width="14" height="2.4" rx="1.2" fill="var(--paper)"/>
    <rect x="15" y="32.5" width="14" height="2.4" rx="1.2" fill="var(--paper)"/>
    <rect x="15" y="39.5" width="14" height="2.4" rx="1.2" fill="var(--paper)"/>
    <rect x="15" y="46" width="14" height="2" rx="1" fill="var(--paper)"/>
  `;
}
function footprintIcon(){
  return `<svg width="72" height="56" viewBox="0 0 72 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(0,4) rotate(-8 22 32)">${shoeSole("var(--stone)")}</g>

function showAuthError(msg) { authError.textContent = msg; authError.classList.remove("hidden"); }
function friendlyAuthError(e) {
  const code = e?.code || "";
  if (code.includes("email-already-in-use")) return "That email already has an account — try logging in.";
  if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "Email or password didn't match.";

function attachMyPageListeners() {
  const signoutBtn = document.getElementById("profile-signout");
  if (!signoutBtn) return; // not on My page right now

  signoutBtn.addEventListener("click", () => {
    if (confirm("Sign out of the club calendar?")) signOut(auth);
  });
  document.getElementById("profile-delete-account").addEventListener("click", async () => {
    const sure = confirm(
      "Permanently delete your profile, stats, and account?\n\n" +
      "This removes you from the Members list and deletes your personal records, goals, and logged runs. " +
      "Comments and RSVPs you've left on existing events will stay (like most apps, deleting your account doesn't rewrite others' history). " +
      "This cannot be undone."
    );
    if (!sure) return;

    const uid = currentUser.uid;
    try {
      await deleteDoc(doc(db, "profiles", uid)).catch(() => {});
      await deleteDoc(doc(db, "users", uid)).catch(() => {});
      await deleteUser(auth.currentUser);
      // onAuthStateChanged fires automatically once the account is gone, returning to sign-in.
    } catch (err) {
      if (err.code === "auth/requires-recent-login") {
        const password = prompt("For security, please re-enter your password to confirm account deletion:");
        if (!password) return;
        try {
          const cred = EmailAuthProvider.credential(currentUser.email, password);
          await reauthenticateWithCredential(auth.currentUser, cred);
          await deleteUser(auth.currentUser);
        } catch (err2) {
          alert("Couldn't verify your password — your data was removed, but the account sign-in itself may still exist. Try again or contact whoever manages the club's Firebase project.");
        }
      } else {
        alert("Something went wrong deleting your account. Please try again.");
      }
    }
  });
  document.getElementById("profile-photo-input").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) uploadProfilePhoto(file);
  });
  document.getElementById("contact-info-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const phone = document.getElementById("profile-phone").value.trim();
    const birthday = document.getElementById("profile-birthday").value;
    await setDoc(doc(db, "users", currentUser.uid), { phone, birthday }, { merge: true });
    const btn = e.target.querySelector("button[type=submit]");
    const original = btn.textContent;
    btn.textContent = "Saved ✓";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
  document.getElementById("add-personal-run-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const data = {
      title: document.getElementById("pr-title").value.trim(),
      date: document.getElementById("pr-date").value,
      distance: document.getElementById("pr-distance").value.trim(),
      time: document.getElementById("pr-time").value.trim(),
      notes: document.getElementById("pr-notes").value.trim(),
    };
    if (!data.date) return;
    addPersonalRun(data);
    e.target.reset();
  });
  document.getElementById("add-goal-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = document.getElementById("goal-text").value.trim();
    const targetDate = document.getElementById("goal-date").value;
    if (!text) return;
    addGoal(text, targetDate);
    e.target.reset();
  });
  document.querySelectorAll("[data-save-pr]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.savePr;
      const row = btn.closest(".club-result-row");
      const time = row.querySelector(".pr-time-input").value.trim();
      setPR(key, time);
    });
  });
  const addCustomPrForm = document.getElementById("add-custom-pr-form");
  if (addCustomPrForm) {
    addCustomPrForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const label = document.getElementById("custom-pr-label").value.trim();
      const time = document.getElementById("custom-pr-time").value.trim();
      if (!label) return;
      addCustomPR(label, time);
      e.target.reset();
    });
  }
  document.querySelectorAll("[data-save-custom-pr]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.saveCustomPr;
      const row = btn.closest(".club-result-row");
      const time = row.querySelector(".custom-pr-time-input").value.trim();
      updateCustomPR(id, time);
    });
  });
  document.querySelectorAll("[data-delete-custom-pr]").forEach((btn) => {
    btn.addEventListener("click", () => { if (confirm("Delete this personal record?")) deleteCustomPR(btn.dataset.deleteCustomPr); });
  });
  document.querySelectorAll("[data-save-result]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const runId = btn.dataset.saveResult;
      const row = btn.closest(".club-result-row");
      const time = row.querySelector(".cr-time-input").value.trim();
      setClubResult(runId, time, "");
    });
  });
  document.querySelectorAll("[data-delete-personal-run]").forEach((btn) => {
    btn.addEventListener("click", () => { if (confirm("Delete this logged run?")) deletePersonalRun(btn.dataset.deletePersonalRun); });
  });
  document.querySelectorAll("[data-toggle-goal]").forEach((btn) => {
    btn.addEventListener("click", () => toggleGoalDone(btn.dataset.toggleGoal));
  });
  document.querySelectorAll("[data-delete-goal]").forEach((btn) => {
    btn.addEventListener("click", () => { if (confirm("Delete this goal?")) deleteGoal(btn.dataset.deleteGoal); });
  });
}

onAuthStateChanged(auth, (user) => {
  if (unsubscribeRuns) { unsubscribeRuns(); unsubscribeRuns = null; }
  if (unsubscribeMembers) { unsubscribeMembers(); unsubscribeMembers = null; }
  if (unsubscribeProfile) { unsubscribeProfile(); unsubscribeProfile = null; }
  if (user) {
    currentUser = { uid: user.uid, name: user.displayName || user.email.split("@")[0], email: user.email };
    authScreen.classList.add("hidden");
    appEl.classList.remove("hidden");
    document.getElementById("avatar-btn").textContent = currentUser.name.trim().split(/\s+/)[0];
    // Keep the member directory entry fresh without touching joinedAt (set once, at signup)
    setDoc(doc(db, "users", currentUser.uid), { name: currentUser.name, email: currentUser.email }, { merge: true }).catch(() => {});
    listenToRuns();
    listenToMembers();
    listenToProfile();
  } else {
    currentUser = null;
    appEl.classList.add("hidden");
    authScreen.classList.remove("hidden");
    activeTab = "races";
    signinForm.reset(); signupForm.reset();
  }
});

// ---------------------------------------------------------------------
// FIRESTORE
// ---------------------------------------------------------------------
function listenToRuns() {
  const q = query(collection(db, "runs"), orderBy("date"));
  unsubscribeRuns = onSnapshot(q, (snap) => {
    runs = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.date + (a.time||"")).localeCompare(b.date + (b.time||"")));
    render();
  }, (err) => {
    document.getElementById("main-content").innerHTML =
      `<div class="loading-note">Couldn't load the calendar: ${escapeHtml(err.message)}</div>`;
  });
}

function listenToMembers() {
  unsubscribeMembers = onSnapshot(collection(db, "users"), (snap) => {
    members = snap.docs
      .map((d) => ({ uid: d.id, ...d.data() }))
      .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    render();
  }, () => { /* if rules aren't set up yet, just leave the list empty rather than erroring */ });
}

function listenToProfile() {
  unsubscribeProfile = onSnapshot(doc(db, "profiles", currentUser.uid), (snap) => {
    const data = snap.exists() ? snap.data() : {};
    myProfile = {
      personalRuns: data.personalRuns || [],
      clubResults: data.clubResults || {},
      goals: data.goals || [],
      prs: data.prs || {},
      customPRs: data.customPRs || [],
    };
    if (activeTab === "mypage") render();
  }, () => { /* profile doc/rules not set up yet — just use empty defaults */ });
}


async function addRun(data) {
  await addDoc(collection(db, "runs"), {
    type: data.type === "social" ? "social" : "run",
    title: data.title, date: data.date, time: data.time,
    location: data.location, distance: data.distance, notes: data.notes,
    createdBy: currentUser.uid, createdByName: currentUser.name,
    rsvps: {}, createdAt: serverTimestamp(),
  });
}
async function deleteRun(runId) { await deleteDoc(doc(db, "runs", runId)); }
async function setRsvp(runId, status) {
  const run = runs.find((r) => r.id === runId);
  if (!run) return;
  const rsvps = { ...(run.rsvps || {}) };
  if (rsvps[currentUser.uid]?.status === status) delete rsvps[currentUser.uid];
  else rsvps[currentUser.uid] = { status, name: currentUser.name };
  await updateDoc(doc(db, "runs", runId), { rsvps });
}
async function addComment(runId, text) {
  const trimmed = text.trim();
  if (!trimmed) return;
  const comment = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    uid: currentUser.uid, name: currentUser.name, text: trimmed, createdAt: Date.now(),
  };
  await updateDoc(doc(db, "runs", runId), { comments: arrayUnion(comment) });
}
async function deleteComment(runId, commentId) {
  const run = runs.find((r) => r.id === runId);
  if (!run) return;
  const newComments = (run.comments || []).filter((c) => c.id !== commentId);
  await updateDoc(doc(db, "runs", runId), { comments: newComments });
}
async function toggleReaction(runId, commentId, emoji) {
  const run = runs.find((r) => r.id === runId);
  if (!run) return;
  const newComments = (run.comments || []).map((c) => {
    if (c.id !== commentId) return c;
    const reactions = { ...(c.reactions || {}) };
    const users = reactions[emoji] ? [...reactions[emoji]] : [];
    const idx = users.indexOf(currentUser.uid);
    if (idx >= 0) users.splice(idx, 1); else users.push(currentUser.uid);
    if (users.length) reactions[emoji] = users; else delete reactions[emoji];
    return { ...c, reactions };
  });
  await updateDoc(doc(db, "runs", runId), { comments: newComments });
}

function fileToCompressedDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        // center-crop to a square, then downscale — keeps avatars consistent and small
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const canvas = document.createElement("canvas");
        canvas.width = maxDim; canvas.height = maxDim;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, sx, sy, side, side, 0, 0, maxDim, maxDim);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadProfilePhoto(file) {
  const statusEl = document.getElementById("photo-upload-status");
  statusEl.classList.remove("hidden");
  statusEl.textContent = "Processing photo…";
  try {
    // Firestore caps a document at 1MB total; base64 adds ~33% overhead versus
    // the raw bytes, so keep the encoded string well under that ceiling.
    let dataUrl = await fileToCompressedDataUrl(file, 240, 0.7);
    if (dataUrl.length > 700000) dataUrl = await fileToCompressedDataUrl(file, 180, 0.55);
    if (dataUrl.length > 700000) {
      statusEl.textContent = "That photo is too large even compressed — try a different one.";
      return;
    }
    await setDoc(doc(db, "users", currentUser.uid), { photoURL: dataUrl }, { merge: true });
    statusEl.textContent = "Photo updated.";
    setTimeout(() => statusEl.classList.add("hidden"), 2000);
  } catch (err) {
    statusEl.textContent = "Couldn't process that photo — try a different file.";
  }
}

// ---------------------------------------------------------------------
// RENDER
// ---------------------------------------------------------------------
function runsByDateMap() {
  const map = {};
  for (const r of runs) (map[r.date] = map[r.date] || []).push(r);
  return map;
}
function upcomingRuns() {
  const key = dateKey(today);
  return runs.filter((r) => r.date >= key).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
}
function pastRuns() {
  const key = dateKey(today);
  return runs.filter((r) => r.date < key && typeOf(r) === "run").sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
}

function render() {
  const upcoming = upcomingRuns();
  document.getElementById("races-count").textContent = upcoming.length ? upcoming.length : "";

  // banner
  const bannerSlot = document.getElementById("banner-slot");
  bannerSlot.innerHTML = upcoming.length ? renderBanner(upcoming[0]) : "";
  if (upcoming.length) {
    document.getElementById("next-race-banner").addEventListener("click", () => {
      activeTab = "races"; selectedDate = new Date(upcoming[0].date + "T00:00:00"); render();
    });
  }

  // tabs
  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === activeTab);
  });

  const main = document.getElementById("main-content");
  main.innerHTML = activeTab === "races" ? renderRacesTab(upcoming)
    : activeTab === "history" ? renderHistoryTab(pastRuns())
    : activeTab === "members" ? renderMembersTab()
    : activeTab === "mypage" ? renderMyPageTab()
    : renderCalendarTab();
  attachContentListeners();
}

function renderBanner(run) {
  const goingCount = Object.values(run.rsvps || {}).filter((r) => r.status === "going").length;
  const d = new Date(run.date + "T00:00:00");
  const when = daysUntilLabel(run.date);
  return `
    <button class="banner" id="next-race-banner">
      <div class="banner-date">
        <span class="mon">${MONTHS[d.getMonth()].slice(0,3).toUpperCase()}</span>
        <span class="day">${d.getDate()}</span>
      </div>
      <div style="flex:1; min-width:0;">
        <div class="banner-tag">NEXT UP · ${when.toUpperCase()}</div>
        <div class="banner-title">${escapeHtml(run.title || "Run")}</div>
        <div class="banner-meta">
          ${run.time ? `<span>${fmtTime(run.time)}</span>` : ""}
          ${run.location ? `<span>${escapeHtml(run.location)}</span>` : ""}
          <span>${goingCount} going</span>
        </div>
      </div>
      <div style="position:absolute; left:0; right:0; bottom:0; height:2px; background-image: repeating-linear-gradient(90deg, var(--chartreuse) 0 8px, transparent 8px 14px); opacity:.6;"></div>
    </button>`;
}

function renderRunCard(run, opts = {}) {
  const readOnly = !!opts.readOnly;
  const rsvps = run.rsvps || {};
  const mine = rsvps[currentUser.uid]?.status;
  const going = Object.values(rsvps).filter((r) => r.status === "going").map((r) => r.name);
  const interested = Object.values(rsvps).filter((r) => r.status === "interested").map((r) => r.name);
  const t = typeOf(run);
  const isPastSocial = t === "social" && run.date < dateKey(today);
  const goingLabel = isPastSocial ? "Attended" : "Going";

  return `
    <div class="run-card" data-run-id="${run.id}" style="border-left-color:${typeColor(t)};">
      <div class="run-card-top">
        <div>
          <div class="run-title">${escapeHtml(run.title || "Run")}<span class="type-badge type-${t}">${t === "social" ? "Social" : "Run"}</span></div>
          <div class="run-meta">
            ${run.time ? `<span>${fmtTime(run.time)}</span>` : ""}
            ${run.location ? `<span>${escapeHtml(run.location)}</span>` : ""}
            ${run.distance ? `<span>${escapeHtml(run.distance)}</span>` : ""}
          </div>
          ${run.notes ? `<div class="run-notes">${escapeHtml(run.notes)}</div>` : ""}
          ${run.createdByName ? `<div class="run-by">Added by ${escapeHtml(run.createdByName)}</div>` : ""}
        </div>
        ${run.createdBy === currentUser.uid ? `<button class="run-delete" data-delete="${run.id}">&times;</button>` : ""}
      </div>
      ${readOnly ? `
      <div class="rsvp-row">
        <button class="rsvp-btn ${mine === "going" ? STATUS.going.cls : ""}" data-rsvp="${run.id}" data-status="going">${mine === "going" ? "✓ You were there — tap to undo" : "Mark that you attended"}</button>
      </div>` : `
      <div class="rsvp-row">
        ${Object.entries(STATUS).map(([key,s]) => `
          <button class="rsvp-btn ${mine===key ? s.cls : ""}" data-rsvp="${run.id}" data-status="${key}">${key === "going" ? goingLabel : s.label}</button>
        `).join("")}
      </div>`}
      ${going.length ? `<div class="who-row"><div class="avatar-stack">${going.map(n=>`<div class="avatar-chip" style="background:var(--orange); color:#fff;" title="${escapeHtml(n)}">${initials(n)}</div>`).join("")}</div><span class="who-label">${readOnly ? "Went" : goingLabel} · ${going.map(escapeHtml).join(", ")}</span></div>` : ""}
      ${!readOnly && interested.length ? `<div class="who-row"><div class="avatar-stack">${interested.map(n=>`<div class="avatar-chip" style="background:var(--chartreuse); color:var(--ink);" title="${escapeHtml(n)}">${initials(n)}</div>`).join("")}</div><span class="who-label">Interested · ${interested.map(escapeHtml).join(", ")}</span></div>` : ""}
      ${readOnly && going.length === 0 ? `<div style="font-size:12.5px; color:var(--stone); margin-top:10px;">No one marked as going</div>` : ""}
      ${renderComments(run)}
    </div>`;
}

function renderComments(run) {
  const comments = (run.comments || []).slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  return `
    <div class="comments-section">
      ${comments.length ? `<div class="comment-list">
        ${comments.map((c) => renderComment(run.id, c)).join("")}
      </div>` : ""}
      <form class="comment-form" data-comment-form="${run.id}">
        <input type="text" class="comment-input" placeholder="Coordinate here — who's driving, meeting spot, etc." maxlength="300" />
        <button type="submit" class="comment-send">Send</button>
      </form>
    </div>`;
}

function renderComment(runId, c) {
  const isMine = c.uid === currentUser.uid;
  const reactions = c.reactions || {};
  return `
    <div class="comment-item">
      <div class="comment">
        <span><span class="comment-name">${escapeHtml(c.name)}</span> ${escapeHtml(c.text)}</span>
        ${isMine ? `<button class="comment-delete" data-delete-comment="${runId}:${c.id}" title="Delete comment">&times;</button>` : ""}
      </div>
      <div class="reaction-row">
        ${QUICK_EMOJIS.map((emoji) => {
          const users = reactions[emoji] || [];
          const mine = users.includes(currentUser.uid);
          return `<button class="reaction-btn ${mine ? "active" : ""}" data-react="${runId}:${c.id}:${emoji}">${emoji}${users.length ? ` ${users.length}` : ""}</button>`;
        }).join("")}
      </div>
    </div>`;
}

function renderRacesTab(upcoming) {
  if (upcoming.length === 0) {
    return `<div class="empty-state">
      ${footprintIcon()}
      <div class="empty-title">Nothing on the books</div>
      <div class="empty-body">No upcoming runs yet. Get one on the calendar.</div>
    </div>`;
  }
  const groups = []; let lastKey = null;
  for (const r of upcoming) {
    if (r.date !== lastKey) { groups.push({ date: r.date, runs: [] }); lastKey = r.date; }
    groups[groups.length-1].runs.push(r);
  }
  const todayKey = dateKey(today);
  return groups.map((g) => {
    const d = new Date(g.date + "T00:00:00");
    const isToday = g.date === todayKey;
    return `<div style="margin-bottom:22px;">
      <div class="race-date-head" style="color:${isToday ? 'var(--orange-deep)' : 'var(--ink)'};">
        ${fmtDateLong(d)} ${isToday ? '<span style="font-size:11px; font-weight:700; color:var(--orange-deep);">TODAY</span>' : ""}
      </div>
      ${g.runs.map(renderRunCard).join("")}
    </div>`;
  }).join("");
}

function renderHistoryTab(past) {
  if (past.length === 0) {
    return `<div class="empty-state">
      ${footprintIcon()}
      <div class="empty-title">No history yet</div>
      <div class="empty-body">Past runs will show up here once they've happened.</div>
    </div>`;
  }
  const groups = []; let lastKey = null;
  for (const r of past) {
    if (r.date !== lastKey) { groups.push({ date: r.date, runs: [] }); lastKey = r.date; }
    groups[groups.length-1].runs.push(r);
  }
  return groups.map((g) => {
    const d = new Date(g.date + "T00:00:00");
    return `<div style="margin-bottom:22px;">
      <div class="race-date-head">${fmtDateLong(d)}</div>
      ${g.runs.map((r) => renderRunCard(r, { readOnly: true })).join("")}
    </div>`;
  }).join("");
}


function renderMembersTab() {
  if (members.length === 0) {
    return `<div class="empty-state">
      ${footprintIcon()}
      <div class="empty-title">No members yet</div>
      <div class="empty-body">Once people sign up, they'll show up here.</div>
    </div>`;
  }
  return `
    <div class="member-count">${members.length} member${members.length === 1 ? "" : "s"}</div>
    <div class="member-list">
      ${members.map((m) => {
        const isMe = m.uid === currentUser.uid;
        const joined = m.joinedAt && m.joinedAt.toDate ? m.joinedAt.toDate() : null;
        const avatar = m.photoURL
          ? `<div class="avatar-chip" style="margin-left:0; overflow:hidden; padding:0;"><img src="${m.photoURL}" alt="" style="width:100%; height:100%; object-fit:cover;"></div>`
          : `<div class="avatar-chip" style="background:var(--orange); color:#fff; margin-left:0;">${initials(m.name || "?")}</div>`;
        return `<div class="member-row">
          ${avatar}
          <div class="member-info">
            <div class="member-name">${escapeHtml(m.name || "Unnamed")}${isMe ? ` <span class="type-badge type-run">You</span>` : ""}</div>
            ${joined ? `<div class="member-joined">Joined ${fmtDateLong(joined)}</div>` : ""}
            ${m.phone ? `<div class="member-joined">${escapeHtml(m.phone)}</div>` : ""}
            ${m.birthday ? `<div class="member-joined">🎂 ${fmtBirthdayShort(m.birthday)}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}


function renderCalendarTab() {
  const days = buildMonthGrid(viewMonth.getFullYear(), viewMonth.getMonth());
  const byDate = runsByDateMap();
  const selKey = dateKey(selectedDate);
  const dayRuns = byDate[selKey] || [];

  return `
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">&#8249;</button>
      <div class="cal-month">${MONTHS[viewMonth.getMonth()]} ${viewMonth.getFullYear()}</div>
      <button class="cal-nav-btn" id="cal-next">&#8250;</button>
    </div>
    <div class="cal-grid" style="margin-bottom:4px;">
      ${WEEKDAYS.map((w,i)=>`<div class="cal-weekday">${w}</div>`).join("")}
    </div>
    <div class="cal-grid" style="margin-bottom:22px;">
      ${days.map((d) => {
        const inMonth = d.getMonth() === viewMonth.getMonth();
        const isToday = sameDay(d, today);
        const isSelected = sameDay(d, selectedDate);
        const dayRuns = byDate[dateKey(d)] || [];
        const count = dayRuns.length;
        const hasRun = dayRuns.some((r) => typeOf(r) === "run");
        const hasSocial = dayRuns.some((r) => typeOf(r) === "social");
        let badgeStyle = "background: var(--orange); color:#fff;";
        if (hasRun && hasSocial) badgeStyle = "background: linear-gradient(90deg, var(--orange) 50%, var(--chartreuse) 50%); color:#111;";
        else if (hasSocial) badgeStyle = "background: var(--chartreuse); color:#111;";
        return `<button class="cal-day ${isSelected?"selected":""} ${!inMonth?"other-month":""} ${isToday?"is-today":""}" data-date="${dateKey(d)}">
          <span class="num ${isToday ? "today-mark" : ""}">${d.getDate()}</span>
          ${count > 0 ? `<span class="count-badge" style="${badgeStyle}">${count}</span>` : ""}
        </button>`;
      }).join("")}
    </div>
    <div class="day-panel">
      <div class="day-panel-head">
        <div class="title">${fmtDateLong(selectedDate)}</div>
      </div>
      ${dayRuns.length === 0
        ? `<div class="empty-state" style="padding: 24px 12px;">${footprintIcon()}<div class="empty-body">No runs on the calendar yet. Be the one who plans it.</div></div>`
        : dayRuns.map(renderRunCard).join("")}
    </div>`;
}

function attachContentListeners() {
  document.querySelectorAll("[data-rsvp]").forEach((btn) => {
    btn.addEventListener("click", () => setRsvp(btn.dataset.rsvp, btn.dataset.status));
  });
  document.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", () => { if (confirm("Remove this run?")) deleteRun(btn.dataset.delete); });
  });
  document.querySelectorAll("[data-date]").forEach((btn) => {
    btn.addEventListener("click", () => { selectedDate = new Date(btn.dataset.date + "T00:00:00"); render(); });
  });
  document.querySelectorAll("[data-comment-form]").forEach((form) => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = form.querySelector(".comment-input");
      const text = input.value;
      input.value = "";
      addComment(form.dataset.commentForm, text);
    });
  });
  document.querySelectorAll("[data-delete-comment]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const [runId, commentId] = btn.dataset.deleteComment.split(":");
      if (confirm("Delete this comment?")) deleteComment(runId, commentId);
    });
  });
  document.querySelectorAll("[data-react]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const [runId, commentId, emoji] = btn.dataset.react.split(":");
      toggleReaction(runId, commentId, emoji);
    });
  });
  const prev = document.getElementById("cal-prev");
  const next = document.getElementById("cal-next");
  if (prev) prev.addEventListener("click", () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1); render(); });
  if (next) next.addEventListener("click", () => { viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1); render(); });
  attachMyPageListeners();
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    activeTab = btn.dataset.tab;
    render();
  });
});

const addModal = document.getElementById("add-modal-overlay");

  const isSocial = selectedRunType === "social";
  document.getElementById("distance-field").classList.toggle("hidden", isSocial);
  if (isSocial) document.getElementById("run-distance").value = "";
}
document.getElementById("fab-add").addEventListener("click", () => {
  document.getElementById("run-date").value = dateKey(selectedDate);
  selectedRunType = "run";
  document.getElementById("type-btn-run").classList.add("active-run");
  document.getElementById("type-btn-social").classList.remove("active-social");
  updateDistanceFieldVisibility();
  addModal.classList.remove("hidden");
});
document.getElementById("close-add-modal").addEventListener("click", () => addModal.classList.add("hidden"));
addModal.addEventListener("click", (e) => { if (e.target === addModal) addModal.classList.add("hidden"); });

document.querySelectorAll(".type-toggle-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    selectedRunType = btn.dataset.type;
    document.getElementById("type-btn-run").classList.toggle("active-run", selectedRunType === "run");
    document.getElementById("type-btn-social").classList.toggle("active-social", selectedRunType === "social");
    updateDistanceFieldVisibility();
  });
});

document.getElementById("add-run-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const data = {
    type: selectedRunType,
    title: document.getElementById("run-title").value.trim(),
    date: document.getElementById("run-date").value,
    time: document.getElementById("run-time").value,
    location: document.getElementById("run-location").value.trim(),
    distance: document.getElementById("run-distance").value.trim(),
    notes: document.getElementById("run-notes").value.trim(),
  };
  if (!data.title || !data.date) return;
  await addRun(data);
  e.target.reset();
  addModal.classList.add("hidden");
  selectedDate = new Date(data.date + "T00:00:00");
  activeTab = "races";
});
